name: Feature request
description: Suggest a tool, prompt, data source or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What marketing question or task should this help with?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: New tool / prompt / column alias / data source… Remember the server returns facts; Claude does the reasoning.
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: This keeps the server read-only toward Meta and doesn't call an LLM from the server.
